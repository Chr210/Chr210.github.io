<!-- 画像モーダル（ポートフォリオと同じデザイン） -->
<div id="portfolio-modal" class="portfolio-modal-overlay" style="display:none;">
  <div class="portfolio-modal-content">
    <span class="portfolio-modal-close">×</span>
    <img id="portfolio-modal-img" src="" alt="拡大画像" class="portfolio-modal-img" />
  </div>
</div>
<footer>Copyright © Tomioka Chiharu All rights reserved.</footer>
<script src="js/modal.js"></script>
<script>
// プロフィール画像クリックでポートフォリオ風モーダル表示
const profileModal = document.getElementById('portfolio-modal');
const profileModalImg = document.getElementById('portfolio-modal-img');
function openProfileModal(src) {
  if (!profileModal || !profileModalImg) return;
  profileModalImg.src = src;
  profileModal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

document.querySelectorAll('.profile-photo-img, img[alt*="プロフィール写真"]').forEach(function(img) {
  img.style.cursor = 'pointer';
  img.addEventListener('click', function() {
    openProfileModal(img.src);
  });
});
// ×ボタンで閉じる
const closeBtn = document.querySelector('.portfolio-modal-close');
if (closeBtn) {
  closeBtn.addEventListener('click', function() {
    profileModal.style.display = 'none';
    document.body.style.overflow = '';
  });
}
// モーダル背景クリックで閉じる
if (profileModal) {
  profileModal.addEventListener('click', function(e) {
    if (e.target === profileModal) {
      profileModal.style.display = 'none';
      document.body.style.overflow = '';
    }
  });
}
</script>
